<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Simulasi PPKA - Kepala Stasiun</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header Status Bar -->
    <header class="topbar">
      <div class="brand">
        <span class="badge">PPKA</span>
        <h1>Stasiun Nusantara Raya</h1>
      </div>
      <div class="stats">
        <div class="stat-box">
          <span class="label">WAKTU</span>
          <span id="clock" class="value">06:00:00</span>
        </div>
        <div class="stat-box">
          <span class="label">CUACA</span>
          <span id="weather" class="value">Cerah</span>
        </div>
        <div class="stat-box">
          <span class="label">SKOR</span>
          <span id="score" class="value">100</span>
        </div>
        <div class="stat-box">
          <span class="label">KA SELESAI</span>
          <span id="completed" class="value">0</span>
        </div>
      </div>
      <div class="actions">
        <select id="levelSelect" title="Pilih Tingkat Kesulitan">
          <option value="1">Shift 1: Stasiun Menengah (Normal)</option>
          <option value="2">Shift 2: Jam Sibuk + Hujan</option>
        </select>
        <button id="installBtn" class="btn btn-accent hidden">Install App</button>
        <button id="resetBtn" class="btn btn-danger">Reset Shift</button>
      </div>
    </header>

    <!-- Area Utama: Diagram Jalur & Sinyal -->
    <main class="workspace">
      <section class="canvas-wrapper">
        <canvas id="trackCanvas"></canvas>
        <div id="alertBanner" class="alert-banner hidden"></div>
      </section>

      <!-- Panel Kontrol Sinyal, Wesel & Jadwal -->
      <aside class="control-panel">
        <div class="panel-section">
          <h2>Kendali Wesel</h2>
          <div class="switch-grid" id="switchControls"></div>
        </div>

        <div class="panel-section">
          <h2>Kendali Sinyal Aspek</h2>
          <div class="signal-grid" id="signalControls"></div>
        </div>

        <div class="panel-section schedule-section">
          <h2>Jadwal & Antrean KA</h2>
          <div id="scheduleList" class="schedule-list"></div>
        </div>
      </aside>
    </main>

    <!-- Modal Game Over / Evaluasi -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal-card">
        <h2 id="modalTitle">Insiden Operasional!</h2>
        <p id="modalDesc">Terjadi pelanggaran keselamatan perjalanan kereta api.</p>
        <div class="modal-stats">
          <div>Skor Akhir: <strong id="finalScore">0</strong></div>
          <div>KA Dilayani: <strong id="finalTrains">0</strong></div>
        </div>
        <button id="modalRestartBtn" class="btn btn-primary">Mulai Shift Baru</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
          </html>
